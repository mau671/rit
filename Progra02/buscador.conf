# ==============================================================================
# Configuración del buscador Encuadre (Proyecto 3, Estilo Linux .conf)
# Las rutas relativas se resuelven desde la carpeta Progra02.
# ==============================================================================

[servidor]
puerto = 3000
# Guarda cada búsqueda en un archivo JSONL (sirve para las estadísticas de uso)
registrar_consultas = true
archivo_registro = salida/consultas.jsonl

[elasticsearch]
url = http://localhost:9200
# Índices construidos por Progra01/elasticsearch; el usuario puede escoger entre ellos.
# rit_evaluacion es una muestra pequeña de la política avanzada que se puede
# construir aparte para probar la evaluación mientras se reconstruyen los tres
# índices oficiales (ver documento/Progra02.tex).
indice_por_defecto = rit_avanzado
indices_disponibles = rit_avanzado, rit_estandar, rit_minimo, rit_evaluacion

[coleccion]
# Textos descargados por la araña: se usan para armar los fragmentos
repositorio = ../Progra00/almacenamiento/repositorio

[modelo]
# Debe coincidir con la fórmula con la que se construyeron los índices
esquema_tf = logaritmico
esquema_idf = estandar

[resultados]
por_pagina = 10
maximo_resultados = 1000
caracteres_fragmento = 300
fragmentos_por_resultado = 2
# Solo se analiza el inicio de documentos muy largos para armar fragmentos
caracteres_analisis = 400000

[evaluacion]
# Juicios de relevancia que guarda la interfaz de evaluación (arreglo JSON)
archivo_juicios = salida/juicios.json
# Último informe de métricas; lo reescribe /metricas y lo lee documento/scripts/tablas.py
archivo_metricas = salida/metricas.json
# Profundidad por defecto de P@k, nDCG@k y Recall@k en la página de métricas
# (se puede cambiar por consulta con /metricas?k=5)
profundidad_metricas = 10
