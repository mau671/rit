# ==============================================================================
# Archivo de Configuración del Indexador Elasticsearch (Estilo Linux .conf)
# Política: estandar
# Descripción: Política 2: Minúsculas, eliminación de puntuación, stopwords ES+EN y stemming Snowball
#
# Las políticas de normalización ([normalizacion]) y la fórmula ([modelo]) NO se
# escriben aquí: se leen del .conf del indexador propio indicado en
# configuracion_propio, para que ambos indexadores usen siempre lo mismo.
# Las stopwords, sinónimos y tesauro se leen de la carpeta "recursos" del propio.
# Las rutas relativas se resuelven desde la carpeta elasticsearch/.
# ==============================================================================

[general]
nombre_politica = estandar
descripcion = "Política 2: Minúsculas, eliminación de puntuación, stopwords ES+EN y stemming Snowball"
configuracion_propio = ../propio/configuraciones/estandar.conf

[rutas]
# Misma colección que usa el indexador propio
base_datos = ../../Progra00/almacenamiento/metadatos_araña.db
repositorio = ../../Progra00/almacenamiento/repositorio
# stopwords_es.txt, stopwords_en.txt, sinonimos.txt y tesauro.txt del propio
recursos = ../recursos
directorio_salida = salida

[elasticsearch]
# Conexión y estructura del índice
url = http://localhost:9200
indice = rit_estandar
# 1 shard y 0 réplicas: un solo índice de Lucene, comparable con el archivo del propio
shards = 1
replicas = 0
# default (LZ4) o best_compression (DEFLATE)
codec = default
# false: el texto no se guarda en _source (el propio tampoco guarda el texto)
guardar_texto = false
# false: postings solo con frecuencias, sin posiciones (igual que el propio)
guardar_posiciones = false
# Tamaño de cada envío bulk en bytes y envíos simultáneos
tamano_lote_bytes = 5000000
concurrencia = 2
# Documentos por petición en la fase de estadísticas
tamano_lote_vectores = 50
