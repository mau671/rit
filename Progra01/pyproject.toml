[project]
name = "indexador"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mauricio González Prendas", email = "me@maugp.com" }
]
requires-python = ">=3.13"
dependencies = [
    "snowballstemmer>=3.1.1",
]

[project.scripts]
indexador = "indexador.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
