# ==============================================================================
# Archivo de Configuración del Indexador (Estilo Linux .conf)
# Política: avanzado
# Descripción: Política 3: Normalización completa con stopwords, stemming, números, fechas y tesauro de sinónimos
# ==============================================================================

[general]
nombre_politica = avanzado
descripcion = Política 3: Normalización completa con stopwords, stemming, números, fechas y tesauro de sinónimos

[rutas]
# Rutas a base de datos de metadatos, archivos brutos e índice generado
base_datos = ../Progra00/almacenamiento/metadatos_araña.db
repositorio = ../Progra00/almacenamiento/repositorio
indice_salida = salida/indice_avanzado.idx
directorio_spimi = salida/spimi_avanzado

[normalizacion]
# Opciones lingüísticas de tokenización y filtrado
idioma = auto
minusculas = true
eliminar_puntuacion = true
remover_acentos = false
stopwords = true
idiomas_stopwords = es, en
stemming = true
algoritmo_stemming = snowball
normalizar_numeros = true
modo_numeros = token
normalizar_fechas = true
expandir_sinonimos = true
longitud_minima_token = 2
longitud_maxima_token = 50

[modelo]
# Ponderación TF-IDF y similitud de coseno
esquema_tf = logaritmico
esquema_idf = estandar
normalizacion_coseno = true
suavizado_idf = true

[spimi]
# Parámetros de memoria del algoritmo SPIMI
limite_memoria_mb = 256
docs_por_bloque = 5000
tamano_buffer_escritura_kb = 64
