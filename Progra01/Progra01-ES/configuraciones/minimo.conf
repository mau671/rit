# ==============================================================================
# Archivo de Configuración del Indexador Elasticsearch (Estilo Linux .conf)
# Política: minimo
# Descripción: Política 1: Tokenización básica y minúsculas sin stopwords ni stemming
# Las secciones [normalizacion] y [modelo] son idénticas a las del indexador
# propio (Progra01/configuraciones/minimo.conf) para que ambos índices sean
# comparables. Las rutas relativas se resuelven desde la carpeta Progra01-ES.
# ==============================================================================

[general]
nombre_politica = minimo
descripcion = Política 1: Tokenización básica y minúsculas sin stopwords ni stemming

[rutas]
# Misma colección que usa el indexador propio
base_datos = ../../Progra00/almacenamiento/metadatos_araña.db
repositorio = ../../Progra00/almacenamiento/repositorio
directorio_salida = salida

[normalizacion]
# Opciones lingüísticas de tokenización y filtrado
idioma = auto
minusculas = true
eliminar_puntuacion = true
remover_acentos = false
stopwords = false
idiomas_stopwords = es, en
stemming = false
algoritmo_stemming = snowball
normalizar_numeros = false
modo_numeros = preservar
normalizar_fechas = false
expandir_sinonimos = false
longitud_minima_token = 2
longitud_maxima_token = 50

[modelo]
# Ponderación TF-IDF y similitud de coseno (misma fórmula que el propio)
esquema_tf = logaritmico
esquema_idf = estandar
normalizacion_coseno = true
suavizado_idf = true

[elasticsearch]
# Conexión y estructura del índice
url = http://localhost:9200
indice = rit_minimo
# 1 shard y 0 réplicas: un solo índice de Lucene, comparable con el archivo del propio
shards = 1
replicas = 0
# default (LZ4) o best_compression (DEFLATE)
codec = default
# false: el texto no se guarda en _source (el propio tampoco guarda el texto)
guardar_texto = false
# false: postings solo con frecuencias, sin posiciones (igual que el propio)
guardar_posiciones = false
# Tamaño de cada envío bulk en bytes y envíos simultáneos
tamano_lote_bytes = 5000000
concurrencia = 2
# Documentos por petición en la fase de estadísticas
tamano_lote_vectores = 50
